<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      .mascot-stage {
        position: absolute;
        right: 90px;
        bottom: 78px;
        width: 700px;
        height: 700px;
        transform-origin: 52% 62%;
        will-change: transform;
      }

      .mascot-float,
      .mascot-core {
        position: absolute;
        inset: 0;
        transform-origin: 52% 62%;
        will-change: transform;
      }

      .mascot-art,
      .pen-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
      }

      .mascot-art {
        transform: translateZ(0);
      }

      .pen-layer {
        background-image: url("assets/main_logo.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        clip-path: polygon(64% 27%, 100% 24%, 100% 85%, 62% 86%);
        opacity: 0;
        transform-origin: 82% 60%;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-content" data-layout-allow-overflow>
        <div id="mascot-stage" class="mascot-stage" data-layout-allow-overflow>
          <div id="mascot-float" class="mascot-float">
            <div id="mascot-core" class="mascot-core">
              <img
                class="mascot-art"
                src="assets/main_logo.png"
                alt=""
                draggable="false"
                aria-hidden="true"
              />
              <div id="pen-layer" class="pen-layer" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      tl.set("#mascot-stage", { x: 830 }, 0);
      tl.set("#mascot-float", { y: 8, rotation: -1.2 }, 0);
      tl.set("#mascot-core", { scaleX: 1, scaleY: 1 }, 0);
      tl.set("#pen-layer", { opacity: 0, rotation: 0 }, 0);

      tl.to(
        "#mascot-stage",
        { x: 520, duration: 2, ease: "sine.inOut" },
        1
      );
      tl.to(
        "#mascot-float",
        { y: -10, rotation: -2.2, duration: 2, ease: "power1.inOut" },
        1
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1.018, scaleY: 0.972, duration: 0.08, ease: "power2.out" },
        2.24
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1, scaleY: 1, duration: 0.14, ease: "power2.inOut" },
        2.33
      );

      tl.to(
        "#mascot-stage",
        { x: 0, duration: 0.62, ease: "back.out(1.25)" },
        3
      );
      tl.to(
        "#mascot-float",
        { y: -50, rotation: 1.1, duration: 0.38, ease: "power3.out" },
        3
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1.055, scaleY: 0.94, duration: 0.24, ease: "power2.out" },
        3
      );
      tl.to(
        "#mascot-core",
        { scaleX: 0.985, scaleY: 1.025, duration: 0.18, ease: "sine.out" },
        3.24
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1, scaleY: 1, duration: 0.32, ease: "elastic.out(1, 0.6)" },
        3.43
      );
      tl.to(
        "#mascot-float",
        { y: -13, rotation: -0.35, duration: 0.42, ease: "back.out(1.1)" },
        3.38
      );

      tl.to("#pen-layer", { opacity: 0.82, duration: 0.12, ease: "power1.out" }, 3.42);
      tl.to("#pen-layer", { rotation: -2.3, duration: 0.2, ease: "sine.inOut" }, 3.48);
      tl.to("#pen-layer", { rotation: 1.8, duration: 0.22, ease: "sine.inOut" }, 3.68);
      tl.to("#pen-layer", { rotation: -1.1, duration: 0.2, ease: "sine.inOut" }, 3.91);
      tl.to("#pen-layer", { rotation: 0, duration: 0.24, ease: "sine.inOut" }, 4.12);

      tl.to(
        "#mascot-float",
        { y: -25, rotation: 0.35, duration: 0.54, ease: "sine.inOut" },
        3.86
      );
      tl.to(
        "#mascot-float",
        { y: -14, rotation: -0.25, duration: 0.56, ease: "sine.inOut" },
        4.4
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1.01, scaleY: 0.99, duration: 0.28, ease: "sine.inOut" },
        4.54
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1, scaleY: 1, duration: 0.28, ease: "sine.inOut" },
        4.82
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1.02, scaleY: 0.965, duration: 0.06, ease: "power2.out" },
        5.12
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1, scaleY: 1, duration: 0.1, ease: "power2.inOut" },
        5.19
      );
      tl.to("#pen-layer", { rotation: -1.2, duration: 0.22, ease: "sine.inOut" }, 4.62);
      tl.to("#pen-layer", { rotation: 0.8, duration: 0.24, ease: "sine.inOut" }, 4.84);
      tl.to("#pen-layer", { rotation: 0, duration: 0.2, ease: "sine.inOut" }, 5.08);

      tl.to(
        "#mascot-stage",
        { x: 830, duration: 0.7, ease: "power2.inOut" },
        5.3
      );
      tl.to(
        "#mascot-float",
        { y: 12, rotation: 2.1, duration: 0.7, ease: "sine.inOut" },
        5.3
      );
      tl.to(
        "#mascot-core",
        { scaleX: 0.985, scaleY: 1.025, duration: 0.26, ease: "power2.out" },
        5.3
      );
      tl.to(
        "#mascot-core",
        { scaleX: 1, scaleY: 1, duration: 0.32, ease: "power1.inOut" },
        5.56
      );
      tl.to("#pen-layer", { opacity: 0, duration: 0.18, ease: "power1.in" }, 5.42);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
